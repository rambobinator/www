<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — rambobinator</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#efe7d6">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root { --paper: #efe7d6; --ink: #24221f; --red: #d7263d; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    padding: 3rem 1.25rem;
    text-align: center;
  }
  svg { width: min(480px, 92vw); height: auto; overflow: visible; }
  h1 { margin: 0; font-size: clamp(1.8rem, 6vw, 2.8rem); letter-spacing: 0.04em; }
  p { margin: 0; max-width: 32rem; line-height: 1.6; }
  a { color: inherit; text-decoration-color: var(--red); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  a.back { font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  a:focus-visible { outline: 2px solid var(--red); outline-offset: 4px; border-radius: 2px; }
  html[lang="en"] [lang="fr"], html[lang="fr"] [lang="en"] { display: none; }
  #tangle { transform-origin: 320px 400px; animation: sway 4s ease-in-out infinite; }
  @keyframes sway { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
  @media (prefers-reduced-motion: reduce) { #tangle { animation: none; } }
</style>
<script>
  // /blog/<anything> lives on the blog's own GitHub Pages site.
  if (location.pathname.indexOf('/blog/') === 0) {
    location.replace('https://rambobinator.github.io' + location.pathname + location.search + location.hash);
  }
  // Same choice as the homepage: stored preference first, then the browser language.
  (function () {
    var lang = null;
    try { lang = localStorage.getItem('lang'); } catch (e) {}
    if (!lang) lang = (navigator.language || '').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en';
    document.documentElement.lang = lang === 'fr' ? 'fr' : 'en';
  })();
</script>
</head>
<body>

<svg viewBox="0 0 640 470" role="img" aria-label="A sad audio cassette with crossed-out eyes and its magnetic tape tangled into a knot.">
  <!-- shell -->
  <rect x="40" y="20" width="560" height="340" rx="22" fill="#2b2926"/>
  <rect x="48" y="28" width="544" height="324" rx="16" fill="none" stroke="#3a3733" stroke-width="2"/>

  <!-- label -->
  <rect x="70" y="42" width="500" height="225" rx="10" fill="#f6efdf"/>
  <rect x="70" y="236" width="500" height="9" fill="#f2a900"/>
  <rect x="70" y="249" width="500" height="5" fill="#d7263d"/>
  <text x="92" y="118" font-family="'Bradley Hand','Segoe Print','Comic Sans MS',cursive" font-size="34" font-weight="700" fill="#24221f">track not found</text>
  <line x1="92" y1="128" x2="548" y2="128" stroke="#24221f" stroke-opacity=".25" stroke-width="1.5"/>
  <text x="548" y="228" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#24221f" fill-opacity=".6">404</text>

  <!-- headband -->
  <rect x="40" y="50" width="560" height="24" fill="#d7263d"/>
  <rect x="40" y="68" width="560" height="6" fill="#b01e31"/>

  <!-- window and reels -->
  <rect x="150" y="138" width="340" height="94" rx="47" fill="#151412"/>
  <circle cx="220" cy="185" r="26" fill="#5a3a22"/>
  <circle cx="420" cy="185" r="26" fill="#5a3a22"/>
  <circle cx="220" cy="185" r="21" fill="#f6efdf"/>
  <circle cx="420" cy="185" r="21" fill="#f6efdf"/>
  <!-- eyes: crossed out -->
  <g stroke="#151412" stroke-width="6" stroke-linecap="round">
    <path d="M210 175L230 195M230 175L210 195"/>
    <path d="M410 175L430 195M430 175L410 195"/>
  </g>
  <rect x="150" y="138" width="340" height="94" rx="47" fill="none" stroke="#24221f" stroke-width="4"/>

  <!-- bottom trapezoid -->
  <polygon points="128,360 160,288 480,288 512,360" fill="#33302c" stroke="#45413c" stroke-width="2"/>
  <circle cx="190" cy="328" r="9" fill="#151412"/>
  <circle cx="450" cy="328" r="9" fill="#151412"/>
  <rect x="262" y="318" width="14" height="14" rx="2" fill="#151412"/>
  <rect x="364" y="318" width="14" height="14" rx="2" fill="#151412"/>

  <!-- screws -->
  <g fill="#55514b" stroke="#151412" stroke-width="1.5">
    <circle cx="58" cy="38" r="6"/><circle cx="582" cy="38" r="6"/>
    <circle cx="58" cy="342" r="6"/><circle cx="582" cy="342" r="6"/>
  </g>

  <!-- mouth: the tape, chewed up and tangled -->
  <g id="tangle" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="t" d="M215 356C190 420 260 450 300 410C340 370 250 372 280 420C310 468 390 452 370 404C352 362 300 440 350 446C420 454 450 400 425 356"
          stroke="#5a3a22" stroke-width="9"/>
    <path d="M215 356C190 420 260 450 300 410C340 370 250 372 280 420C310 468 390 452 370 404C352 362 300 440 350 446C420 454 450 400 425 356"
          stroke="#9a6a40" stroke-width="2"/>
  </g>
</svg>

<h1>404</h1>

<p lang="en">The tape got chewed up: this page doesn't exist.</p>
<p lang="fr">La bande s'est emmêlée : cette page n'existe pas.</p>

<p>
  <a class="back" href="/" lang="en">◀◀&#xFE0E; Rewind to the homepage</a>
  <a class="back" href="/" lang="fr">◀◀&#xFE0E; Rembobiner vers l'accueil</a>
</p>

</body>
</html>
